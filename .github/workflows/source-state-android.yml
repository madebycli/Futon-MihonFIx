name: Source state Android regression
on:
  pull_request:
    branches: [devel]
    paths:
      - 'app/src/main/kotlin/io/github/landwarderer/futon/explore/data/MangaSourcesRepository.kt'
      - 'app/src/main/kotlin/io/github/landwarderer/futon/core/db/dao/MangaSourcesDao.kt'
      - 'app/src/androidTest/kotlin/io/github/landwarderer/futon/core/db/SourceStatePersistenceTest.kt'
      - 'app/src/androidTest/kotlin/io/github/landwarderer/futon/core/db/SourceAssimilationTest.kt'
      - '.github/workflows/source-state-android.yml'
permissions:
  contents: read
jobs:
  android-source-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use Android SDK preinstalled on GitHub-hosted runner
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Prepare isolated Gradle mirror
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-state"
          tar --exclude='./.git' --exclude='./.gradle' --exclude='*/build' --exclude='./gradle/gradle-daemon-jvm.properties' -cf - . | tar -xf - -C "$RUNNER_TEMP/source-state"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room persistence regression on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: |
            cd "$RUNNER_TEMP/source-state"
            ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.landwarderer.futon.core.db.SourceStatePersistenceTest,io.github.landwarderer.futon.core.db.SourceAssimilationTest --stacktrace --no-configuration-cache
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-state-android-results
          path: |
            ${{ runner.temp }}/source-state/app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/source-state/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
