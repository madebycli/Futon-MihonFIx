name: Release Build

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            VERSION="${GITHUB_REF#refs/heads/release/v}"
            RELEASE_TAG="v$VERSION"
          else
            echo "::error::Unsupported release ref: $GITHUB_REF"
            exit 1
          fi

          SOURCE_VERSION="$(grep -E '^versionName=' gradle.properties | tail -n 1 | cut -d= -f2-)"
          SOURCE_CODE="$(grep -E '^versionCode=' gradle.properties | tail -n 1 | cut -d= -f2-)"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use MAJOR.MINOR.PATCH, got: $VERSION"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::gradle.properties versionName ($SOURCE_VERSION) does not match release ($VERSION)"
            exit 1
          fi
          if [ "$SOURCE_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::gradle.properties versionCode ($SOURCE_CODE) does not match expected code ($EXPECTED_CODE)"
            exit 1
          fi
          if [ ! -f "docs/releases/$VERSION.md" ]; then
            echo "::error::Missing release notes: docs/releases/$VERSION.md"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$EXPECTED_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Release identity: $RELEASE_TAG, $VERSION ($EXPECTED_CODE)"

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Repository release signing configuration is present."

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug and compile instrumented tests
        run: ./gradlew assembleDebug compileDebugAndroidTestKotlin --stacktrace --no-build-cache --no-configuration-cache

      - name: Run Mihon and upstream novel regression tests
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*minSdk = 26$' app/build.gradle
          ./gradlew testDebugUnitTest \
            --tests "io.github.landwarderer.futon.novel.*" \
            --tests "io.github.landwarderer.futon.onboarding.*" \
            --tests "io.github.landwarderer.futon.core.prefs.HomeBackgroundFontTest" \
            --tests "io.github.landwarderer.futon.core.prefs.NovelAppSettingsTest" \
            --tests "io.github.landwarderer.futon.reader.domain.*" \
            --tests "io.github.landwarderer.futon.details.domain.ComixChapterGroupingTest" \
            --tests "io.github.landwarderer.futon.mihon.MihonExceptionUnwrapTest" \
            --tests "io.github.landwarderer.futon.mihon.ExtensionRepoServiceTest" \
            --tests "io.github.landwarderer.futon.mihon.TachiyomiApkClassLoaderPolicyTest" \
            --tests "io.github.landwarderer.futon.mihon.compat.MihonNetworkHelperTest" \
            --tests "io.github.landwarderer.futon.mihon.compat.MihonSourceApiCompatTest" \
            --tests "io.github.landwarderer.futon.mihon.compat.MihonModernHostContractTest" \
            --tests "io.github.landwarderer.futon.mihon.MihonMangaRepositoryTest" \
            --tests "io.github.landwarderer.futon.mihon.state.MihonSnapshotPersistenceTest" \
            --tests "io.github.landwarderer.futon.mihon.model.MihonDataConvertersTest" \
            --tests "io.github.landwarderer.futon.core.network.GitHubRawUrlCompatTest" \
            --stacktrace \
            --no-build-cache \
            --no-configuration-cache

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Futon-9.9.0-Regression-Reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Run release lint (diagnostic)
        id: release_lint
        continue-on-error: true
        run: >-
          ./gradlew lintRelease
          --stacktrace
          --no-build-cache
          --no-configuration-cache

      - name: Upload release lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Futon-${{ steps.version.outputs.version }}-Lint-Report
          path: |
            app/build/reports/lint-results-release.*
            app/build/intermediates/lint_intermediate_text_report/release/**/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build both signed optimized APKs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          ./gradlew assembleRelease -Pstandalone=false -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --stacktrace --no-build-cache --no-configuration-cache
          cp app/build/outputs/apk/release/app-release.apk "release-artifact/Futon-$VERSION-legacy-update.apk"
          ./gradlew assembleRelease -Pstandalone=true -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --stacktrace --no-build-cache --no-configuration-cache
          cp app/build/outputs/apk/release/app-release.apk "release-artifact/Futon-MihonFix-$VERSION.apk"

      - name: Verify both APK identities, signatures and optimized Mihon ABI
        run: bash scripts/verify-release-apks.sh "$GITHUB_WORKSPACE/release-artifact" "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version_code }}"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android 16 installation and coexistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: bash scripts/test-install-compat.sh "$GITHUB_WORKSPACE/release-artifact" "${{ steps.version.outputs.version }}"

      - name: Record build provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          {
            echo "Futon MihonFix $VERSION ($VERSION_CODE)"
            echo "Source commit: $GITHUB_SHA"
            echo "Upstream: AppFuton/Futon 9162c49a380029365cc53283daa766c1f78b6e5d"
            echo "Signing: repository-release-key"
            echo "Certificate SHA256: 12fe17245decb84c98985ddcc08884b874d10a78e4fb747a6ed3e2a42d77b625"
            echo "Build: optimized release (R8 minify + resource shrinking)"
            echo "Standalone: io.github.madebycli.futon.mihonfix"
            echo "Legacy update: io.github.landwarderer.futon"
            echo "Android 16 emulator install/upgrade/coexistence: passed"
            echo "Physical Galaxy S26 Ultra test: pending"
          } > release-artifact/BUILD-INFO.txt

      - name: Upload APKs and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Futon-9.9.0-APKs-And-Install-Evidence
          path: release-artifact/*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Futon MihonFix ${{ steps.version.outputs.version }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifact/Futon-MihonFix-${{ steps.version.outputs.version }}.apk
            release-artifact/Futon-MihonFix-${{ steps.version.outputs.version }}.apk.sha256
            release-artifact/Futon-${{ steps.version.outputs.version }}-legacy-update.apk
            release-artifact/Futon-${{ steps.version.outputs.version }}-legacy-update.apk.sha256
            release-artifact/INSTALL-VALIDATION.txt
            release-artifact/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
