name: Navigation UI emulator check
# Test-only workflow of the integration branch for PR #31 and PR #32: it installs the debug build on an emulator,
# switches the navigation settings and the tabs and keeps screenshots, window dumps and logcat as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [test/nav-tabs-integration]
permissions:
  contents: write
concurrency:
  group: nav-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nav-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --no-configuration-cache --console=plain
          ls -la app/build/outputs/apk/debug/
      - name: Upload the integration debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clio-navigation-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the navigation checks on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/ci/nav-ui-check.sh "$PWD/nav-ui-out"
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.landwarderer.futon.main.ui.RapidTabSelectionTest --no-configuration-cache
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-ui-screens
          path: |
            nav-ui-out/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish screenshots to the test-only branch test/nav-ui-screens
        if: always()
        run: |
          set -euo pipefail
          test -d nav-ui-out || exit 0
          rm -f nav-ui-out/.db nav-ui-out/.db-wal nav-ui-out/.prefs.xml
          cd nav-ui-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b test/nav-ui-screens
          git add -A
          git commit -q -m "Screenshots of run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test/nav-ui-screens
