name: Release screenshots
# Test-only: screenshots for the release notes, published to the branch test/release-screens-out.
on:
  push:
    branches: [test/release-screens]
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --no-configuration-cache --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ci/release-screens.sh "$PWD/release-screens"
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          test -d release-screens || exit 0
          rm -f release-screens/.db release-screens/.db-wal release-screens/.prefs.xml
          cd release-screens
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b test/release-screens-out
          git add -A
          git commit -q -m "Release screenshots of run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test/release-screens-out
